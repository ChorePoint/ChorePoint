<div class="kid-card">
  <div class="kid-card-top">
    <div class="kid-avatar avatar-blue">{{ kid.avatar }}</div>
    <div class="kid-info">
      <div class="kid-name">{{ kid.name }}</div>
      <div class="kid-meta">Age {{ kid.age }} · {{ kid.chores.length }} active chores</div>
    </div>
    <div class="kid-points-badge">{{ kid.lifetimePoints }} ⭐</div>
  </div>
  <div class="kid-progress">
    <div class="progress-label">
      Weekly completion %<span>{{ kid.kidStats.weeklyCompletionPercentage }}%</span>
    </div>
    <div class="progress-track">
      <div
        class="progress-fill fill-blue"
        [style.width]="kid.kidStats.weeklyCompletionPercentage + '%'"
      ></div>
    </div>
  </div>
  <app-kid-stats />
  <div class="kid-actions">
    <button class="kid-action-btn" (click)="navigateToChore()">📋 Chores</button>
    <button class="kid-action-btn" (click)="navigateToShop()">🎁 Rewards</button>
    <button class="kid-action-btn primary" [routerLink]="['/kids/edit', kid.kidId]">✏️ Edit</button>
  </div>
</div>
